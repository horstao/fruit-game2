<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1030">
<title>Pega Comida</title>
<style>
  :root {
    color-scheme: dark;
    --plum: #1c1030;
    --plum-2: #2a1846;
    --cream: #fff6e8;
    --tangerine: #ff8a3d;
    --mint: #5df2b0;
    --berry: #ff4d6d;
    --ellipse-w: 40vw;                 /* largura da elipse = 40% da tela */
    --ellipse-h: min(52vw, 70vh);
    --ellipse-top: 42%;                /* mantenha igual a CONFIG.ellipseCy */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--cream);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: var(--plum);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen { position: absolute; inset: 0; }
  .hidden { display: none !important; }

  /* ---------- Boas-vindas (antes de ligar a câmera) ---------- */
  #welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background:
      radial-gradient(120% 70% at 50% 0%, #3b2166 0%, transparent 60%),
      var(--plum);
  }
  #welcome .parade { font-size: 44px; letter-spacing: 6px; line-height: 1.3; }
  #welcome h1 {
    margin: 0; font-size: clamp(40px, 13vw, 64px); line-height: .95; font-weight: 900;
    letter-spacing: -0.02em; color: var(--cream);
  }
  #welcome p { margin: 0; max-width: 28ch; font-size: 17px; line-height: 1.4; opacity: .85; }
  button {
    font: inherit; font-weight: 800; font-size: 18px; color: var(--plum);
    background: var(--tangerine); border: 0; border-radius: 999px;
    padding: 16px 28px; min-height: 52px; cursor: pointer;
    box-shadow: 0 6px 0 #b8541a;
    transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8541a; }
  button:disabled { opacity: .6; }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  #welcomeMsg { min-height: 2.6em; font-size: 15px; color: #ffd0a8; }

  /* ---------- Tela inicial / pausa (instrução + elipse) ---------- */
  #start { pointer-events: none; }
  #start .instr {
    position: absolute; left: 0; right: 0; top: max(5%, env(safe-area-inset-top));
    margin: 0; padding: 0 9%; text-align: center;
    font-size: clamp(19px, 5.4vw, 30px); line-height: 1.2; font-weight: 800;
    text-shadow: 0 2px 12px rgba(0,0,0,.75);
  }
  #pausedTag {
    position: absolute; left: 50%; top: calc(max(5%, env(safe-area-inset-top)) + 4.6em);
    transform: translateX(-50%); font-size: 15px; font-weight: 800;
    background: var(--tangerine); color: var(--plum); padding: 6px 14px; border-radius: 999px;
  }
  #ellipse {
    position: absolute; left: 50%; top: var(--ellipse-top);
    width: var(--ellipse-w); height: var(--ellipse-h);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px dashed rgba(255,246,232,.95);
    box-shadow: 0 0 0 200vmax rgba(28,16,48,.62);
    transition: border-color .2s, box-shadow .2s;
  }
  #ellipse.ok {
    border-style: solid; border-color: var(--mint);
    box-shadow: 0 0 28px 4px rgba(93,242,176,.7), 0 0 0 200vmax rgba(28,16,48,.5);
  }
  #hint {
    position: absolute; left: 0; right: 0;
    top: calc(var(--ellipse-top) + var(--ellipse-h) / 2 + 20px);
    margin: 0; padding: 0 9%; text-align: center; font-size: 18px; font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  #hint.ok { color: var(--mint); }

  /* ---------- Fim de jogo ---------- */
  #over {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px;
    background: rgba(28,16,48,.88);
  }
  #over h2 { margin: 0; font-size: 36px; font-weight: 900; }
  #over .big { font-size: clamp(72px, 24vw, 120px); font-weight: 900; line-height: 1; color: var(--tangerine); }
  #over .best { font-size: 17px; opacity: .85; margin-bottom: 10px; }
  #over small { opacity: .7; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    #ellipse, button { transition: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="game"></canvas>

  <!-- Antes de ligar a câmera -->
  <div id="welcome" class="screen">
    <div class="parade" aria-hidden="true">🍓🍗🍊</div>
    <h1>Pega<br>Comida</h1>
    <p>Acerte a comida com as mãos. Desvie do resto.</p>
    <button id="btnCam" type="button">Ligar a câmera</button>
    <div id="welcomeMsg" role="status"></div>
  </div>

  <!-- Tela inicial (também aparece quando o jogo pausa) -->
  <div id="start" class="screen hidden">
    <p class="instr">Apoie seu celular e coloque sua face no centro</p>
    <div id="pausedTag" class="hidden">Jogo pausado</div>
    <div id="ellipse"></div>
    <p id="hint"></p>
  </div>

  <!-- Fim de jogo -->
  <div id="over" class="screen hidden">
    <h2>Fim de jogo</h2>
    <div class="big" id="finalScore">0</div>
    <div class="best" id="bestScore"></div>
    <button id="btnAgain" type="button">Jogar de novo</button>
    <small id="overCount"></small>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================  CONFIGURAÇÃO  ===================== */
const CONFIG = {
  ellipseCy: 0.53,        // centro vertical da elipse (fração da altura)
  ellipseW: 0.50,         // largura da elipse (fração da largura da tela)
  maxFaceW: 0.50,         // rosto maior que isso (fração da largura) pausa o jogo
  minFaceW: 0.16,         // rosto menor que isso não conta como "centralizado"
  centerTolX: 0.13,       // tolerância horizontal para centralizar
  centerTolY: 0.11,       // tolerância vertical
  holdMs: 800,            // tempo com o rosto centralizado para (re)começar
  lostMs: 450,            // sem rosto por esse tempo => pausa
  lives: 3,
  pointsFood: 10,
  // detecção de movimento (hit)
  motionW: 80,            // largura da grade de análise
  pixelDiff: 28,          // diferença de luminância para um pixel "mexeu"
  hitRatio: 0.20,         // fração de pixels em movimento dentro do emoji para contar o toque
  globalMax: 0.50,        // se mais que isso da imagem mexe, ignora (celular balançando)
  motionEveryMs: 60,
  // queda
  fallSecondsStart: 3.4,  // segundos para cruzar a tela no começo
  spawnStart: 1.7,        // segundos entre pares no começo
  spawnMin: 0.85,
};

const FOOD  = ['🍓','🍒','🍎','🍅','🌶️','🍉','🍑','🍊','🥕','🌭','🍳','🍗'];
const OTHER = ['📞','📟','📠','💾','💡','🪙','💿','🪑','🧸','🍀','🌷'];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DEBUG = /[?&]debug/.test(location.search);

/* =====================  ELEMENTOS  ===================== */
const $ = id => document.getElementById(id);
const video = $('cam'), canvas = $('game'), ctx = canvas.getContext('2d');
const elWelcome = $('welcome'), elStart = $('start'), elOver = $('over');
const elEllipse = $('ellipse'), elHint = $('hint'), elPaused = $('pausedTag');
const btnCam = $('btnCam'), welcomeMsg = $('welcomeMsg');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SW = CONFIG.motionW; SH = Math.max(8, Math.round(SW * H / W));
  mc.width = SW; mc.height = SH;
  prevGray = null;
}

/* =====================  ESTADO  ===================== */
let mode = 'welcome';        // welcome | waiting | playing | over
let g = newGame();
let best = 0;
let holdT = 0;
let flash = 0;               // piscada vermelha ao errar
const fx = [];               // efeitos visuais

function newGame() {
  return { started: false, score: 0, lives: CONFIG.lives, combo: 0, goods: 0,
           items: [], spawnT: 0.6, grace: 0 };
}

/* =====================  ÁUDIO / VIBRAÇÃO  ===================== */
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.12, slideTo = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfxGood = combo => beep(520 + Math.min(combo, 12) * 40, 0.12, 'triangle', 0.14, 900 + combo * 30);
const sfxBad  = () => { beep(180, 0.28, 'sawtooth', 0.12, 70); navigator.vibrate && navigator.vibrate(140); };

/* =====================  CÂMERA E DETECÇÃO DE ROSTO  ===================== */
let detectFace = null;       // () => {x,y,w,h} em pixels do vídeo | null
let lastVideoTime = -1;

async function loadDetector() {
  // 1) MediaPipe (funciona em qualquer celular moderno)
  try {
    const ver = '0.10.14';
    const mp = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/+esm`);
    const fileset = await mp.FilesetResolver.forVisionTasks(
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/wasm`);
    const modelAssetPath =
      'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
    let det;
    try {
      det = await mp.FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath, delegate: 'GPU' }, runningMode: 'VIDEO', minDetectionConfidence: 0.5 });
    } catch (_) {
      det = await mp.FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath, delegate: 'CPU' }, runningMode: 'VIDEO', minDetectionConfidence: 0.5 });
    }
    detectFace = async () => {
      if (video.currentTime === lastVideoTime) return undefined;   // frame repetido
      lastVideoTime = video.currentTime;
      const res = det.detectForVideo(video, performance.now());
      let bestBox = null;
      for (const d of res.detections || []) {
        const b = d.boundingBox; if (!b) continue;
        if (!bestBox || b.width > bestBox.w) bestBox = { x: b.originX, y: b.originY, w: b.width, h: b.height };
      }
      return bestBox;
    };
    return true;
  } catch (e) { console.warn('MediaPipe indisponível:', e); }

  // 2) API nativa do navegador (Chrome/Android com Shape Detection)
  if ('FaceDetector' in window) {
    try {
      const nd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 2 });
      detectFace = async () => {
        const faces = await nd.detect(video);
        let bestBox = null;
        for (const f of faces) {
          const b = f.boundingBox;
          if (!bestBox || b.width > bestBox.w) bestBox = { x: b.x, y: b.y, w: b.width, h: b.height };
        }
        return bestBox;
      };
      return true;
    } catch (e) { console.warn('FaceDetector nativo falhou:', e); }
  }
  return false;
}

async function startCamera() {
  btnCam.disabled = true; welcomeMsg.textContent = 'Abrindo a câmera…';
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (_) {}

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    welcomeMsg.textContent = 'Câmera indisponível. Abra esta página por HTTPS (ou localhost).';
    btnCam.disabled = false; return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    welcomeMsg.textContent = (e && e.name === 'NotAllowedError')
      ? 'Permissão negada. Libere a câmera nas configurações do navegador.'
      : 'Não consegui abrir a câmera frontal.';
    btnCam.disabled = false; return;
  }

  welcomeMsg.textContent = 'Carregando detecção de rosto…';
  const ok = await loadDetector();
  if (!ok) {
    welcomeMsg.textContent = 'Não consegui carregar a detecção de rosto. Verifique a internet e tente de novo.';
    btnCam.disabled = false; return;
  }
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
  goWaiting();
}
btnCam.addEventListener('click', startCamera);

/* ----- Estado do rosto (em fração da tela, já espelhado) ----- */
let face = null;            // {cx, cy, w} suavizado
let lastSeen = -1e9;
let detecting = false;

function toScreen(b) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  const visW = W / s, visH = H / s, sx = (vw - visW) / 2, sy = (vh - visH) / 2;
  const x0 = (b.x - sx) / visW, x1 = (b.x + b.w - sx) / visW;
  const y0 = (b.y - sy) / visH, y1 = (b.y + b.h - sy) / visH;
  return { x: 1 - x1, y: y0, w: x1 - x0, h: y1 - y0 };    // espelhado
}

async function runDetect(now) {
  if (detecting || !detectFace || !video.videoWidth) return;
  detecting = true;
  try {
    const box = await detectFace();
    if (box !== undefined) {
      if (box) {
        const s = toScreen(box);
        const cur = { cx: s.x + s.w / 2, cy: s.y + s.h / 2, w: s.w, h: s.h };
        face = face && now - lastSeen < 1000
          ? { cx: face.cx + (cur.cx - face.cx) * 0.55, cy: face.cy + (cur.cy - face.cy) * 0.55,
              w: face.w + (cur.w - face.w) * 0.55, h: face.h + (cur.h - face.h) * 0.55 }
          : cur;
        lastSeen = now;
      }
    }
  } catch (e) { /* ignora quadros ruins */ }
  detecting = false;
}

const faceVisible = now => !!face && now - lastSeen < CONFIG.lostMs;
const faceTooBig  = () => face && face.w > CONFIG.maxFaceW;
function faceStatus(now) {
  if (!faceVisible(now)) return 'none';
  if (face.w > CONFIG.maxFaceW) return 'big';
  if (face.w < CONFIG.minFaceW) return 'small';
  if (Math.abs(face.cx - 0.5) > CONFIG.centerTolX || Math.abs(face.cy - CONFIG.ellipseCy) > CONFIG.centerTolY) return 'off';
  return 'ok';
}
const HINTS = {
  none:  'Não estou vendo seu rosto',
  big:   'Perto demais. Afaste o celular',
  small: 'Chegue um pouco mais perto',
  off:   'Centralize o rosto na elipse',
  ok:    'Perfeito! Fique assim…',
};

/* =====================  DETECÇÃO DE MOVIMENTO (MÃOS)  ===================== */
let SW = CONFIG.motionW, SH = 140;
const mc = document.createElement('canvas');
const mctx = mc.getContext('2d', { willReadFrequently: true });
mctx.imageSmoothingQuality = 'high';
let grayA = null, grayB = null, prevGray = null;
let motion = null;           // Uint8Array SW*SH (1 = mexeu)
let motionValid = false, globalMotion = 0;

function updateMotion() {
  if (!video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(SW / vw, SH / vh);
  const visW = SW / s, visH = SH / s, sx = (vw - visW) / 2, sy = (vh - visH) / 2;
  mctx.save(); mctx.translate(SW, 0); mctx.scale(-1, 1);
  mctx.drawImage(video, sx, sy, visW, visH, 0, 0, SW, SH);
  mctx.restore();
  const d = mctx.getImageData(0, 0, SW, SH).data;
  const n = SW * SH;
  if (!grayA || grayA.length !== n) { grayA = new Uint8Array(n); grayB = new Uint8Array(n); motion = new Uint8Array(n); prevGray = null; }
  const cur = grayA;
  for (let i = 0, j = 0; i < n; i++, j += 4) cur[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  if (prevGray) {
    let cnt = 0;
    for (let i = 0; i < n; i++) {
      const df = cur[i] - prevGray[i];
      const m = (df > CONFIG.pixelDiff || df < -CONFIG.pixelDiff) ? 1 : 0;
      motion[i] = m; cnt += m;
    }
    globalMotion = cnt / n;
    motionValid = globalMotion < CONFIG.globalMax;
  }
  grayA = grayB; grayB = cur; prevGray = cur;     // troca os buffers
}

// fração de pixels em movimento dentro do círculo do emoji
function regionMotion(cx, cy, r) {
  if (!motion) return 0;
  const px = cx / W * SW, py = cy / H * SH, pr = r / W * SW;
  const x0 = Math.max(0, Math.floor(px - pr)), x1 = Math.min(SW - 1, Math.ceil(px + pr));
  const y0 = Math.max(0, Math.floor(py - pr)), y1 = Math.min(SH - 1, Math.ceil(py + pr));
  let tot = 0, mv = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x - px, dy = y - py;
    if (dx * dx + dy * dy <= pr * pr) { tot++; mv += motion[y * SW + x]; }
  }
  return tot ? mv / tot : 0;
}

/* =====================  LÓGICA DO JOGO  ===================== */
const emojiSize = () => W * 0.20;
const pick = a => a[(Math.random() * a.length) | 0];

function spawnPair() {
  const S = emojiSize();
  const foodLeft = Math.random() < 0.5;
  const jitter = () => (Math.random() - 0.5) * W * 0.04;
  const mk = (side, food) => ({
    x: (side === 'L' ? W * 0.15 : W * 0.85) + jitter(), y: -S * 0.6,
    ch: pick(food ? FOOD : OTHER), food, hit: false, side });
  g.items.push(mk('L', foodLeft), mk('R', !foodLeft));
}

function level() { return Math.min(g.goods, 60); }
function fallSpeed() {            // px/s
  const secs = CONFIG.fallSecondsStart / (1 + level() * 0.02);
  return H / Math.max(1.5, secs);
}
function spawnEvery() { return Math.max(CONFIG.spawnMin, CONFIG.spawnStart - level() * 0.015); }

function popFx(x, y, ch, good) {
  fx.push({ kind: 'pop', x, y, ch, t: 0, dur: 0.35 });
  if (good) for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 160;
    fx.push({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, dur: 0.45 });
  }
}
function textFx(x, y, txt, color) { fx.push({ kind: 'text', x, y, txt, color, t: 0, dur: 0.8 }); }

function hitItem(e) {
  e.hit = true;
  if (e.food) {
    g.combo++; g.goods++;
    const mult = Math.min(5, 1 + Math.floor(g.combo / 5));
    const pts = CONFIG.pointsFood * mult;
    g.score += pts;
    popFx(e.x, e.y, e.ch, true);
    textFx(e.x, e.y - 10, '+' + pts, '#5df2b0');
    sfxGood(g.combo);
  } else {
    g.lives--; g.combo = 0; flash = 1;
    popFx(e.x, e.y, e.ch, false);
    textFx(e.x, e.y - 10, '−1 ❤️', '#ff4d6d');
    sfxBad();
    if (g.lives <= 0) gameOver();
  }
}

function update(dt) {
  g.spawnT -= dt;
  if (g.spawnT <= 0) { spawnPair(); g.spawnT = spawnEvery(); }
  if (g.grace > 0) g.grace -= dt;

  const sp = fallSpeed(), S = emojiSize(), R = S * 0.55;
  for (const e of g.items) {
    e.y += sp * dt;
    if (!e.hit && g.grace <= 0 && motionValid && e.y > S * 0.1 && e.y < H + S * 0.2) {
      if (regionMotion(e.x, e.y, R) >= CONFIG.hitRatio) { hitItem(e); if (mode !== 'playing') return; }
    }
  }
  g.items = g.items.filter(e => {
    if (e.hit) return false;
    if (e.y - S > H) { if (e.food) g.combo = 0; return false; }   // comida que escapou quebra o combo
    return true;
  });
}

/* =====================  TRANSIÇÕES DE TELA  ===================== */
let overTimer = 0;
function goWaiting() {
  mode = 'waiting'; holdT = 0;
  elWelcome.classList.add('hidden'); elOver.classList.add('hidden'); elStart.classList.remove('hidden');
  elPaused.classList.toggle('hidden', !g.started);
}
function beginPlay() {
  mode = 'playing'; holdT = 0;
  g.started = true; g.grace = 0.9;
  elStart.classList.add('hidden');
  beep(660, 0.1, 'triangle', 0.1, 990);
}
function gameOver() {
  mode = 'over';
  best = Math.max(best, g.score);
  $('finalScore').textContent = g.score;
  $('bestScore').textContent = 'Melhor da sessão: ' + best;
  elStart.classList.add('hidden'); elOver.classList.remove('hidden');
  overTimer = 6;
}
function again() {
  g = newGame(); fx.length = 0; flash = 0;
  goWaiting();
}
$('btnAgain').addEventListener('click', again);
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') goWaiting(); });

/* =====================  DESENHO  ===================== */
function drawEmoji(ch, x, y, size, alpha = 1) {
  ctx.globalAlpha = 1.0; //alpha;
  ctx.font = `${size}px ${EMOJI_FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, x, y);
  ctx.globalAlpha = 1.0; //1 
}

function drawLanes() {
  const S = emojiSize();
  ctx.fillStyle = 'rgba(255,246,232,.7)';
  for (const cx of [W * 0.15, W * 0.85]) {
    ctx.beginPath(); ctx.roundRect(cx - S * 0.75, 0, S * 1.5, H, S * 0.5); ctx.fill();
  }
}

function drawHUD() {
  const fs = Math.round(W * 0.11);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${fs}px ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif`;
  ctx.lineWidth = fs * 0.14; ctx.strokeStyle = 'rgba(28,16,48,.85)'; ctx.lineJoin = 'round';
  const y = Math.max(H * 0.075, 54);
  ctx.strokeText(g.score, W / 2, y); ctx.fillStyle = '#fff6e8'; ctx.fillText(g.score, W / 2, y);

  let hearts = '';
  for (let i = 0; i < CONFIG.lives; i++) hearts += i < g.lives ? '❤️' : '🖤';
  ctx.font = `${Math.round(W * 0.06)}px ${EMOJI_FONT}`;
  ctx.fillText(hearts, W / 2, y + fs * 0.85);

  const mult = Math.min(5, 1 + Math.floor(g.combo / 5));
  if (mult > 1) {
    ctx.font = `900 ${Math.round(W * 0.05)}px ui-rounded, "Trebuchet MS", system-ui, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(28,16,48,.85)';
    ctx.strokeText('combo ×' + mult, W / 2, y + fs * 1.55);
    ctx.fillStyle = '#ff8a3d'; ctx.fillText('combo ×' + mult, W / 2, y + fs * 1.55);
  }
}

function drawFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt;
    if (f.t >= f.dur) { fx.splice(i, 1); continue; }
    const p = f.t / f.dur;
    if (f.kind === 'pop') {
      drawEmoji(f.ch, f.x, f.y, emojiSize() * (0.8 + p * 0.9), 1 - p);
    } else if (f.kind === 'spark') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      ctx.fillStyle = `rgba(255,138,61,${1 - p})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 4 * (1 - p) + 1, 0, 7); ctx.fill();
    } else if (f.kind === 'text') {
      ctx.globalAlpha = 1 - p * p;
      ctx.font = `900 ${Math.round(W * 0.07)}px ui-rounded, "Trebuchet MS", system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(28,16,48,.9)';
      const y = f.y - p * H * 0.1;
      ctx.strokeText(f.txt, f.x, y); ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, y);
      ctx.globalAlpha = 1;
    }
  }
}

function drawDebug(now) {
  if (motion) {
    ctx.fillStyle = 'rgba(255,60,60,.45)';
    const cw = W / SW, ch = H / SH;
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++)
      if (motion[y * SW + x]) ctx.fillRect(x * cw, y * ch, cw + 0.5, ch + 0.5);
  }
  if (face) {
    ctx.strokeStyle = faceVisible(now) ? '#5df2b0' : '#888'; ctx.lineWidth = 2;
    ctx.strokeRect((face.cx - face.w / 2) * W, (face.cy - face.h / 2) * H, face.w * W, face.h * H);
  }
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`mode=${mode} face=${face ? face.w.toFixed(2) : '-'} motion=${(globalMotion * 100).toFixed(0)}% ${motionValid ? '' : '(ignorado)'}`, 8, H - 10);
}

function render(dt, now) {
  ctx.clearRect(0, 0, W, H);
  if (mode === 'welcome') return;

  if (g.started || mode === 'playing') {
    drawLanes();
    const S = emojiSize();
    for (const e of g.items) if (!e.hit) drawEmoji(e.ch, e.x, e.y, S * 0.82);
    drawFx(dt);
    drawHUD();
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,77,109,${flash * 0.35})`; ctx.fillRect(0, 0, W, H);
    flash = Math.max(0, flash - dt * 3);
  }
  if (DEBUG) drawDebug(now);
}

/* =====================  LOOP PRINCIPAL  ===================== */
let last = performance.now(), lastDetect = 0, lastMotion = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (mode !== 'welcome') {
    if (now - lastDetect > 70) { lastDetect = now; runDetect(now); }
    if (now - lastMotion > CONFIG.motionEveryMs) { lastMotion = now; updateMotion(); }
  }

  if (mode === 'waiting') {
    const st = faceStatus(now);
    elHint.textContent = HINTS[st];
    elHint.classList.toggle('ok', st === 'ok');
    elEllipse.classList.toggle('ok', st === 'ok');
    if (st === 'ok') { holdT += dt * 1000; if (holdT >= CONFIG.holdMs) beginPlay(); }
    else holdT = 0;
  } else if (mode === 'playing') {
    // pausa: rosto sumiu ou ficou maior que 40% da largura
    if (!faceVisible(now) || faceTooBig()) goWaiting();
    else update(dt);
  } else if (mode === 'over') {
    overTimer -= dt;
    $('overCount').textContent = overTimer > 0 ? `Voltando ao início em ${Math.ceil(overTimer)}s` : '';
    if (overTimer <= 0) again();
  }

  render(dt, now);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
})();
</script>
